name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Creates the Pages site (build_type: workflow) if it doesn't exist yet.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /gym-day/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify live URL returns 200 and the app HTML
        run: |
          url="https://its-vincentzhu.github.io/gym-day/"
          for i in $(seq 1 10); do
            code=$(curl -s -o /tmp/page.html -w '%{http_code}' "$url") || code=000
            if [ "$code" = "200" ] && grep -q "<title>Gym Day</title>" /tmp/page.html; then
              echo "OK: $url returned 200 with Gym Day HTML"
              exit 0
            fi
            echo "attempt $i: status=$code, retrying..."
            sleep 15
          done
          echo "FAILED: $url did not serve the app"
          cat /tmp/page.html || true
          exit 1
